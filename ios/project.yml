# SousLens iOS — XcodeGen spec. Never hand-edit SousLens.xcodeproj; run `make ios-project`.
name: SousLens
options:
  bundleIdPrefix: com.souslens
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

# Brief 009 (DECISIONS #19): DAT is linked ONLY by the SousLensGlasses target. The public
# SousLens target must never list these products (`ios/scripts/check-no-dat.sh` enforces it).
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: V56DG94ZL5
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Tokens are exposed through DesignSystem/Colors.swift; generated symbols would collide
    # with SwiftUI's own `.background` / `.accent` style names.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  SousLens:
    type: application
    platform: iOS
    sources:
      - path: SousLens
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios
        PRODUCT_NAME: SousLens
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
    entitlements:
      path: SousLens/Resources/SousLens.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.souslens.ios
        # Universal-link stub (brief 003): the domain is not live yet; `onOpenURL` handles the path.
        com.apple.developer.associated-domains:
          - applinks:souslens.app
    info:
      path: SousLens/Resources/Info.plist
      properties:
        CFBundleDisplayName: SousLens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # souslens://recipe/{id} share links (brief 003 REC-01).
        CFBundleURLTypes:
          - CFBundleURLName: com.souslens.ios.recipe
            CFBundleURLSchemes:
              - souslens
            CFBundleTypeRole: Viewer
        NSCameraUsageDescription: >-
          SousLens uses the camera only when you tap to scan your pantry or ask the coach to look
          at a step. Nothing is recorded in the background.
        NSMicrophoneUsageDescription: >-
          SousLens listens only while you hold the talk button, so you can ask about a step or
          update your pantry hands-free.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into text so the coach can answer. Audio may be
          processed by Apple to transcribe it and is not kept by SousLens afterwards.
        NSLocalNetworkUsageDescription: >-
          SousLens connects to a SousLens server on your local network during development so the
          app can load recipes from your own machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies: []

  # Brief 009: the PM-only glasses flavour (Meta Developer Mode, never the public TestFlight).
  # Same sources as SousLens plus SousLensGlasses/ (compiled only here, behind `GLASSES`).
  # Separate bundle id so both apps install side by side.
  SousLensGlasses:
    type: application
    platform: iOS
    sources:
      - path: SousLens
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/SousLens.entitlements"
      - path: SousLensGlasses
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "SousLensGlasses.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.glasses
        PRODUCT_NAME: SousLensGlasses
        PRODUCT_MODULE_NAME: SousLensGlasses
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GLASSES
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: GLASSES
    entitlements:
      path: SousLensGlasses/SousLensGlasses.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.souslens.ios.glasses
    info:
      path: SousLensGlasses/Info.plist
      properties:
        CFBundleDisplayName: SousLens Glasses
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Meta AI calls back into this scheme after registration / permission. Deliberately not
        # `souslens`, so the public app keeps its share links when both are installed.
        CFBundleURLTypes:
          - CFBundleURLName: com.souslens.ios.glasses.meta
            CFBundleURLSchemes:
              - souslensglasses
            CFBundleTypeRole: Editor
        # Developer Mode config. MetaAppID 0 + empty ClientToken is Meta's own CameraAccess sample
        # setup; docs/release/glasses.md lists what changes for a Wearables Developer Center app.
        MWDAT:
          AppLinkURLScheme: "souslensglasses://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
        # Every key below is checked at runtime by MWDATCore 1.0.1 (it logs "... must contain"
        # and refuses the link when one is missing; MockDeviceKit applies the same check).
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
        UIBackgroundModes:
          - bluetooth-central
          - external-accessory
        NSBonjourServices:
          - _bonjour._tcp
          - _meta-datax._tcp
        LSApplicationQueriesSchemes:
          - fb-viewapp
        NSBluetoothAlwaysUsageDescription: >-
          SousLens Glasses uses Bluetooth to connect to your Meta glasses, so their camera can scan
          your pantry when you tap to capture.
        NSCameraUsageDescription: >-
          SousLens uses the camera only when you tap to scan your pantry or ask the coach to look
          at a step. Nothing is recorded in the background.
        NSMicrophoneUsageDescription: >-
          SousLens listens only while you hold the talk button, so you can ask about a step or
          update your pantry hands-free.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into text so the coach can answer. Audio may be
          processed by Apple to transcribe it and is not kept by SousLens afterwards.
        NSLocalNetworkUsageDescription: >-
          SousLens Glasses uses the local network to reach your Meta glasses over Wi-Fi and, during
          development, a SousLens server on your own machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera

  # MockDeviceKit-driven tests of the glasses flavour (`make ios-check-glasses`).
  SousLensGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SousLensGlassesTests
    dependencies:
      - target: SousLensGlasses
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.glasses.tests
        GENERATE_INFOPLIST_FILE: YES

  SousLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SousLensTests
    dependencies:
      - target: SousLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # Live end-to-end smoke against a running local backend. Not in the SousLens scheme / CI;
  # run with `make ios-smoke` (PRD §16 Slice 0 gate).
  SousLensSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SousLensSmokeTests
    dependencies:
      - target: SousLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.smoke
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SousLens

schemes:
  SousLensSmoke:
    build:
      targets:
        SousLens: all
        SousLensSmokeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SousLensSmokeTests
      environmentVariables:
        # Expanded from the build setting `make ios-smoke` passes on the command line.
        SOUSLENS_SMOKE_LOG: $(SOUSLENS_SMOKE_LOG)
  SousLens:
    build:
      targets:
        SousLens: all
        SousLensTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SousLensTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  SousLensGlasses:
    build:
      targets:
        SousLensGlasses: all
        SousLensGlassesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SousLensGlassesTests
      environmentVariables:
        # Optional: where the screenshot tests write JPEGs (empty → skipped).
        SOUSLENS_GLASSES_SHOTS: $(SOUSLENS_GLASSES_SHOTS)
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# SousLens iOS — XcodeGen spec. Never hand-edit SousLens.xcodeproj; run `make ios-project`.
name: SousLens
options:
  bundleIdPrefix: com.souslens
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: V56DG94ZL5
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Tokens are exposed through DesignSystem/Colors.swift; generated symbols would collide
    # with SwiftUI's own `.background` / `.accent` style names.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  SousLens:
    type: application
    platform: iOS
    sources:
      - path: SousLens
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios
        PRODUCT_NAME: SousLens
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
    entitlements:
      path: SousLens/Resources/SousLens.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.souslens.ios
    info:
      path: SousLens/Resources/Info.plist
      properties:
        CFBundleDisplayName: SousLens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: >-
          SousLens uses the camera only when you tap to scan your pantry or ask the coach to look
          at a step. Nothing is recorded in the background.
        NSMicrophoneUsageDescription: >-
          SousLens listens only while you hold the talk button, so you can ask about a step or
          update your pantry hands-free.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into text so the coach can answer. Audio may be
          processed by Apple to transcribe it and is not kept by SousLens afterwards.
        NSLocalNetworkUsageDescription: >-
          SousLens connects to a SousLens server on your local network during development so the
          app can load recipes from your own machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies: []

  SousLensTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SousLensTests
    dependencies:
      - target: SousLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # Live end-to-end smoke against a running local backend. Not in the SousLens scheme / CI;
  # run with `make ios-smoke` (PRD §16 Slice 0 gate).
  SousLensSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SousLensSmokeTests
    dependencies:
      - target: SousLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.souslens.ios.smoke
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SousLens

schemes:
  SousLensSmoke:
    build:
      targets:
        SousLens: all
        SousLensSmokeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SousLensSmokeTests
      environmentVariables:
        # Expanded from the build setting `make ios-smoke` passes on the command line.
        SOUSLENS_SMOKE_LOG: $(SOUSLENS_SMOKE_LOG)
  SousLens:
    build:
      targets:
        SousLens: all
        SousLensTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SousLensTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

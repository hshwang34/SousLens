# Umma iOS — XcodeGen spec. Never hand-edit Umma.xcodeproj; run `make ios-project`.
name: Umma
options:
  bundleIdPrefix: com.umma
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: V56DG94ZL5
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Tokens are exposed through DesignSystem/Colors.swift; generated symbols would collide
    # with SwiftUI's own `.background` / `.accent` style names.
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  Umma:
    type: application
    platform: iOS
    sources:
      - path: Umma
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umma.ios
        PRODUCT_NAME: Umma
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
    entitlements:
      path: Umma/Resources/Umma.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.umma.ios
        # Universal-link stub (brief 003): the domain is not live yet; `onOpenURL` handles the path.
        com.apple.developer.associated-domains:
          - applinks:umma.app
    info:
      path: Umma/Resources/Info.plist
      properties:
        CFBundleDisplayName: Umma
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Launch: the persimmon mark on Flesh (brief 013). Names are asset-catalog entries.
        UILaunchScreen:
          UIColorName: Background
          UIImageName: BrandMark
        # Bagel Fat One (OFL 1.1): wordmark and large display titles only (DECISIONS #23).
        UIAppFonts:
          - BagelFatOne-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # umma://recipe/{id} share links (brief 003 REC-01).
        CFBundleURLTypes:
          - CFBundleURLName: com.umma.ios.recipe
            CFBundleURLSchemes:
              - umma
            CFBundleTypeRole: Viewer
        NSCameraUsageDescription: >-
          Umma uses the camera only when you tap to scan your pantry or ask the coach to look
          at a step. Nothing is recorded in the background.
        NSMicrophoneUsageDescription: >-
          Umma listens only while you hold the talk button, so you can ask about a step or
          update your pantry hands-free.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition turns what you say into text so the coach can answer. Audio may be
          processed by Apple to transcribe it and is not kept by Umma afterwards.
        NSLocalNetworkUsageDescription: >-
          Umma connects to an Umma server on your local network during development so the
          app can load recipes from your own machine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies: []

  UmmaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UmmaTests
    dependencies:
      - target: Umma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umma.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # Live end-to-end smoke against a running local backend. Not in the Umma scheme / CI;
  # run with `make ios-smoke` (PRD §16 Slice 0 gate).
  UmmaSmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UmmaSmokeTests
    dependencies:
      - target: Umma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umma.ios.smoke
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Umma

schemes:
  UmmaSmoke:
    build:
      targets:
        Umma: all
        UmmaSmokeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - UmmaSmokeTests
      environmentVariables:
        # Expanded from the build setting `make ios-smoke` passes on the command line.
        UMMA_SMOKE_LOG: $(UMMA_SMOKE_LOG)
  Umma:
    build:
      targets:
        Umma: all
        UmmaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - UmmaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

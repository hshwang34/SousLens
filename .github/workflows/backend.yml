name: backend
on:
  push: { paths: ['backend/**', 'fixtures/**', '.github/workflows/backend.yml'] }
  pull_request: { paths: ['backend/**', 'fixtures/**', '.github/workflows/backend.yml'] }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: souslens, POSTGRES_PASSWORD: souslens, POSTGRES_DB: souslens_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U souslens" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Slice 5 needs ffmpeg/ffprobe. Not from apt (the mirror hung twice on 2026-10-23): a static
      # build via the setup action, bounded by its own step timeout as well as the job's.
      - uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5
        with:
          ffmpeg-version: release
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://souslens:souslens@localhost:5432/souslens_test
          DATABASE_URL: postgresql+asyncpg://souslens:souslens@localhost:5432/souslens_test
          JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
          AUTH_MODE: dev
          SOUSLENS_REQUIRE_FFMPEG: "1"   # ffmpeg tests fail instead of skipping in CI
        run: make check

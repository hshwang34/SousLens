# macOS minutes are billed 10x on private repos, so this runs on demand and on release tags only.
name: ios
on:
  workflow_dispatch:
  push: { tags: ['v*'] }
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The image defaults to Xcode 16.4. Build with the iOS 26 SDK (Liquid Glass, brief 006)
      # against the 17.2 deployment target; tests still run on an iPhone simulator.
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list runtimes
      - run: brew install xcodegen
      # Public app: unit tests + the no-DAT link check (DECISIONS #19).
      - run: make ios-check SIM="iPhone 16"
      # Brief 009: the PM-only glasses flavour (DAT 1.0.1) + its MockDeviceKit tests. Runs on an
      # iOS 26 simulator: MWDATCore's metadata crashes the XCTest host on iOS 17 runtimes.
      - name: Glasses flavour
        run: |
          SIM_OS=$(ios/scripts/sim-os.sh "iPhone 16")
          case "$SIM_OS" in 26.*) ;; *) echo "::warning::iPhone 16 runtime is $SIM_OS; glasses tests expect iOS 26" ;; esac
          make ios-check-glasses SIM="iPhone 16"

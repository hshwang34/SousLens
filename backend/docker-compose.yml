# Local Postgres 16 for Umma. Host port 5433 (5432 is often taken by brew postgresql@16).
services:
  postgres:
    image: postgres:16
    container_name: umma-postgres
    environment:
      POSTGRES_USER: umma
      POSTGRES_PASSWORD: umma
      POSTGRES_DB: umma
    ports:
      - "5433:5432"
    volumes:
      - umma-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umma -d umma"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Dev S3 (brief 008). Production is Tigris. MinIO's community images are no longer pullable
  # from Docker Hub/Quay, so dev uses moto's S3 server on the same port the settings default to
  # (http://localhost:9000). It is in-memory: uploads vanish when the container restarts. The
  # worker creates the bucket on start in dev.
  s3:
    image: motoserver/moto:5.1.4
    container_name: umma-s3
    ports:
      - "9000:5000"

volumes:
  umma-pgdata:
